services:
  frontend:
    build:
      context: .
      target: development
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-4200}:4200"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4200/').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  frontend-check:
    profiles: ["ci"]
    build:
      context: .
      target: check
